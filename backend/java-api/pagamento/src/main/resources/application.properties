spring.application.name=pagamento
server.port=${PORT:8081}

# Banco de dados próprio e isolado deste microsserviço
spring.datasource.url=jdbc:h2:file:./data/pagamentodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Endereços dos serviços consumidos via REST
app.usuario-carro.url=${USUARIO_CARRO_URL:http://localhost:8080}
app.reserva.url=${RESERVA_URL:http://127.0.0.1:8002}
